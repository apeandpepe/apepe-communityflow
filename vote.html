<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base href="/communityflow/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEPE · Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0a0a0a;color:#fff;font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
body{padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;}
.card{width:100%;max-width:1280px;max-height:calc(100vh - 32px);display:grid;grid-template-columns:1fr 1fr;gap:0;background:#111;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.06);box-shadow:0 30px 80px rgba(0,0,0,.55);position:relative;}

.img-panel{background:#0a1402;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;}
.hero-img{width:100%;height:100%;object-fit:contain;display:block;background:#0a1402;}
.img-fallback{display:none;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.4);text-align:center;}
.fb-txt{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-top:8px;}

.right-panel{display:flex;flex-direction:column;background:#0e0e0e;position:relative;min-height:0;overflow:hidden;}
.r-edge{position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(203,237,58,.18),transparent);}

/* AUTH BAR */
.auth-bar{position:relative;z-index:3;padding:14px 28px;border-bottom:1px solid rgba(255,255,255,.06);background:#0e0e0e;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.back-btn{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.7);font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.7px;padding:7px 14px;border-radius:5px;cursor:pointer;text-transform:uppercase;text-decoration:none;flex-shrink:0;}
.back-btn:hover{color:#fff;border-color:rgba(255,255,255,.3);}
.auth-action{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:8px;}
.auth-msg{font-size:12px;color:rgba(255,255,255,.45);font-weight:500;margin-right:6px;}
.auth-btn{background:linear-gradient(180deg,#cbed3a 0%,#b4e840 100%);color:#0a1402;border:none;font-family:inherit;font-weight:700;font-size:11.5px;letter-spacing:.5px;padding:8px 16px;border-radius:6px;cursor:pointer;transition:all .15s;box-shadow:0 1px 0 rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3);text-transform:uppercase;}
.auth-btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
.auth-btn-secondary{background:transparent;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.75);font-family:inherit;font-weight:600;font-size:11px;letter-spacing:.6px;padding:7px 13px;border-radius:5px;cursor:pointer;transition:all .15s;text-transform:uppercase;}
.auth-btn-secondary:hover{color:#fff;border-color:rgba(255,255,255,.3);}
.auth-user{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.auth-dot{width:8px;height:8px;border-radius:50%;background:#cbed3a;box-shadow:0 0 6px rgba(203,237,58,.6);flex-shrink:0;}
.auth-nick{color:rgba(255,255,255,.9);font-weight:600;letter-spacing:.2px;}

/* AUTH MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:#1a1a1a;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:28px;width:100%;max-width:380px;}
.modal-h{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;margin-bottom:6px;}
.modal-sub{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:20px;line-height:1.55;}
.modal-field{margin-bottom:13px;}
.modal-label{display:block;font-size:10.5px;font-weight:600;color:rgba(255,255,255,.55);letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px;}
.modal-input{width:100%;background:#222;border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:10px 13px;font-family:inherit;font-size:14px;color:#fff;outline:none;}
.modal-input:focus{border-color:rgba(255,255,255,.25);background:#252525;}
.modal-actions{display:flex;flex-direction:column;gap:8px;margin-top:18px;}
.modal-btn{width:100%;background:linear-gradient(180deg,#cbed3a 0%,#b4e840 100%);color:#0a1402;border:none;font-family:inherit;font-weight:800;font-size:13px;letter-spacing:.7px;padding:13px;border-radius:8px;cursor:pointer;text-transform:uppercase;box-shadow:0 1px 0 rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3);}
.modal-btn:hover:not(:disabled){filter:brightness(1.05);}
.modal-btn:disabled{opacity:.5;cursor:not-allowed;}
.modal-link{text-align:center;font-size:12.5px;color:rgba(255,255,255,.55);margin-top:6px;}
.modal-link a{color:#cbed3a;cursor:pointer;text-decoration:none;font-weight:600;}
.modal-link a:hover{text-decoration:underline;}
.modal-error{background:rgba(232,90,90,.1);border:1px solid rgba(232,90,90,.3);border-radius:6px;padding:9px 12px;color:#e85a5a;font-size:12px;margin-top:10px;display:none;}
.modal-error.show{display:block;}

/* VOTE CONTENT */
.r-body{padding:22px 26px 14px;flex:1;overflow-y:auto;min-height:0;}
.r-head{margin-bottom:12px;}
.r-tag{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#cbed3a;border:1px solid rgba(203,237,58,.4);padding:4px 11px;border-radius:4px;margin-bottom:14px;}
.r-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:#fff;letter-spacing:-.3px;line-height:1.1;margin-bottom:4px;text-transform:uppercase;}
.r-q{font-size:14px;color:rgba(255,255,255,.65);line-height:1.5;}
.r-meta{display:flex;align-items:center;gap:14px;margin-top:11px;font-size:11.5px;color:rgba(255,255,255,.4);font-weight:500;}
.r-meta-it{display:flex;align-items:center;gap:5px;}
.r-divider{height:1px;background:rgba(255,255,255,.07);margin:12px 0;}

/* COUNTDOWN BOX (upcoming) */
.countdown-box{background:linear-gradient(180deg,#181818 0%,#0c0c0c 100%);border:1px solid rgba(232,170,90,.25);border-radius:14px;padding:32px 24px 28px;margin:0 0 16px;text-align:center;position:relative;overflow:hidden;}
.countdown-box::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,#e8aa5a,transparent);opacity:.6;}
.cd-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#e8aa5a;margin-bottom:14px;}
.cd-time-row{display:flex;justify-content:center;gap:18px;margin-bottom:12px;}
.cd-unit{display:flex;flex-direction:column;align-items:center;}
.cd-val{font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:800;color:#fff;line-height:1;letter-spacing:-1px;}
.cd-u{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.45);margin-top:4px;}
.cd-sep{font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:300;color:rgba(255,255,255,.25);line-height:1;}
.cd-when{font-size:12px;color:rgba(255,255,255,.5);line-height:1.5;margin-top:6px;}

/* OPTIONS */
.opts-box{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.opt{background:#1a1a1a;border:1.5px solid rgba(255,255,255,.06);border-radius:9px;padding:10px 14px;cursor:pointer;font-family:inherit;color:#fff;text-align:left;font-size:14px;display:flex;align-items:center;gap:11px;transition:all .15s;width:100%;}
.opt:hover:not(:disabled){border-color:rgba(255,255,255,.18);}
.opt.selected{background:rgba(203,237,58,.06);border-color:#cbed3a;}
.opt:disabled{opacity:.55;cursor:not-allowed;}
.opt-radio{width:18px;height:18px;border-radius:50%;border:1.8px solid rgba(255,255,255,.25);flex-shrink:0;position:relative;}
.opt.selected .opt-radio{border-color:#cbed3a;}
.opt.selected .opt-radio::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:#cbed3a;}
.opt-label{flex:1;font-weight:500;}
.opt-num{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:rgba(255,255,255,.4);font-weight:700;letter-spacing:1px;}

/* RESULT (closed/voted) */

/* New result cards */
.result-h{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:14px;}
.result-h-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:500;color:rgba(255,255,255,.6);letter-spacing:2.5px;text-transform:uppercase;}
.result-h-total{display:flex;align-items:baseline;gap:6px;}
.result-h-num{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:500;color:#cbed3a;}
.result-h-lbl{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:1.5px;text-transform:uppercase;}

.r-card{background:#1a1a1a;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:11px 14px;margin-bottom:7px;}
.r-card.leading{background:linear-gradient(90deg,rgba(203,237,58,.12) 0%,rgba(203,237,58,.03) 100%);border:1.5px solid #cbed3a;padding:13px 15px;margin-bottom:8px;position:relative;}
.r-card-badge{position:absolute;top:-1px;right:11px;background:#cbed3a;color:#0a1402;font-size:9px;font-weight:600;letter-spacing:1.5px;padding:2px 8px;border-radius:0 0 4px 4px;text-transform:uppercase;}
.r-card-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.r-card.leading .r-card-row{margin-bottom:8px;}
.r-card-info{display:flex;align-items:baseline;gap:6px;}
.r-card-num{color:rgba(255,255,255,.4);font-size:12px;font-weight:500;}
.r-card.leading .r-card-num{color:rgba(255,255,255,.45);font-size:13px;}
.r-card-name{color:rgba(255,255,255,.88);font-size:14px;}
.r-card.leading .r-card-name{color:#fff;font-size:15px;font-weight:500;}
.r-card-you{color:#cbed3a;font-size:11px;margin-left:4px;letter-spacing:.5px;}
.r-card-stats{text-align:right;}
.r-card-pct{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:500;color:rgba(255,255,255,.85);line-height:1;}
.r-card.leading .r-card-pct{font-size:22px;color:#cbed3a;}
.r-card-votes{font-size:10.5px;color:rgba(255,255,255,.45);margin-top:1px;}
.r-card.leading .r-card-votes{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px;}
.r-card-bar{height:4px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;}
.r-card.leading .r-card-bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;}
.r-card-fill{height:100%;background:rgba(203,237,58,.55);border-radius:2px;}
.r-card.leading .r-card-fill{background:#cbed3a;border-radius:3px;}
.r-card-fill.low{background:rgba(203,237,58,.35);}

.result-box{background:#1a1a1a;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px;margin-bottom:10px;}
.result-h{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;color:rgba(255,255,255,.7);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.result-total{font-size:11px;color:rgba(255,255,255,.4);font-weight:600;letter-spacing:1px;}
.r-opt{margin-bottom:9px;}
.r-opt:last-child{margin-bottom:0;}
.r-opt-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:13px;}
.r-opt-name{color:rgba(255,255,255,.85);font-weight:500;}
.r-opt-name.my{color:#cbed3a;font-weight:700;}
.r-opt-pct{color:rgba(255,255,255,.5);font-weight:600;font-size:12px;}
.r-bar-bg{background:#0a0a0a;border-radius:5px;height:9px;overflow:hidden;border:1px solid rgba(255,255,255,.04);}
.r-bar-fill{height:100%;background:linear-gradient(90deg,#9bc92a 0%,#cbed3a 100%);border-radius:4px;transition:width .5s ease;}
.r-bar-fill.my{background:linear-gradient(90deg,#cbed3a 0%,#e8ff66 100%);box-shadow:0 0 8px rgba(203,237,58,.35);}

/* SUB BAR */
.sub-bar{padding:12px 26px 16px;border-top:1px solid rgba(255,255,255,.06);background:#0a0a0a;}
.sub-btn{width:100%;background:linear-gradient(180deg,#cbed3a 0%,#b4e840 100%);color:#0a1402;border:none;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;letter-spacing:.7px;padding:11px;border-radius:9px;cursor:pointer;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 1px 0 rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3);transition:all .15s;}
.sub-btn:hover:not(:disabled){filter:brightness(1.05);transform:translateY(-1px);}
.sub-btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-icon{font-size:18px;line-height:1;}
.btn-sub{font-size:10.5px;font-weight:600;color:rgba(10,20,2,.7);letter-spacing:1px;margin-top:2px;}

/* STATE NOTICES */
.state-notice{background:#1a1a1a;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:11px;font-size:13px;color:rgba(255,255,255,.7);line-height:1.5;}
.state-notice.upcoming{border-color:rgba(232,170,90,.3);background:rgba(232,170,90,.04);color:#e8aa5a;}
.state-notice.closed{border-color:rgba(255,255,255,.07);color:rgba(255,255,255,.55);}
.state-notice.voted{border-color:rgba(203,237,58,.3);background:rgba(203,237,58,.04);color:#cbed3a;}
.state-icon{font-size:18px;flex-shrink:0;}

.loading,.empty{padding:40px 20px;text-align:center;color:rgba(255,255,255,.4);font-size:13px;font-style:italic;}

@media(max-width:980px){
  body{padding:14px;}
  .card{grid-template-columns:1fr;}
  .img-panel{min-height:300px;}
  .r-body{padding:24px 18px 16px;}
  .sub-bar{padding:14px 18px 18px;}
  .r-title{font-size:22px;}
  .countdown-box{padding:24px 16px 20px;}
  .cd-val{font-size:34px;}
  .cd-sep{font-size:34px;}
  .cd-time-row{gap:12px;}
}
@media(max-width:480px){
  .auth-bar{padding:11px 18px;}
  .auth-msg{font-size:11px;}
  .auth-btn{font-size:11px;padding:7px 13px;}
  .auth-nick{font-size:11.5px;}
}
</style>
</head>
<body>
<div class="card">
  <!-- LEFT: IMAGE -->
  <div class="img-panel">
    <img class="hero-img" src="vote-image.jpg" alt=""
      onerror="this.style.display='none';document.querySelector('.img-fallback').style.display='flex';">
    <div class="img-fallback"><div style="font-size:36px;opacity:.15;">🖼️</div><div class="fb-txt">Place vote-image.jpg here</div></div>
  </div>

  <!-- RIGHT: VOTE -->
  <div class="right-panel">
    <div class="r-edge"></div>

    <!-- AUTH BAR -->
    <div class="auth-bar">
      <a class="back-btn" href="/communityflow">← Back</a>
      <div class="auth-action" id="auth-status">
        <span class="auth-msg">Sign in to vote</span>
        <button class="auth-btn-secondary" id="open-login" type="button">Log In</button>
        <button class="auth-btn" id="open-signup" type="button">Sign Up</button>
      </div>
    </div>

    <div class="r-body" id="vote-wrap">
      <div class="loading" id="loading">Loading poll...</div>
      <div id="poll-content" style="display:none;"></div>
    </div>

    <div class="sub-bar" id="sub-bar" style="display:none;">
      <button class="sub-btn" id="sub-btn" disabled>
        <span class="btn-icon">➤</span>
        <span>
          <span id="btn-txt">SUBMIT YOUR VOTE</span>
          <div class="btn-sub">Submit your selection</div>
        </span>
      </button>
    </div>
  </div>
</div>

<!-- LOGIN MODAL -->
<div class="modal-bg" id="login-modal">
  <div class="modal">
    <div class="modal-h">Log In</div>
    <div class="modal-sub">Sign in to your APEPE Community account.</div>
    <div class="modal-field">
      <label class="modal-label">Email</label>
      <input class="modal-input" type="email" id="login-email" autocomplete="email">
    </div>
    <div class="modal-field">
      <label class="modal-label">Password</label>
      <input class="modal-input" type="password" id="login-password" autocomplete="current-password">
    </div>
    <div class="modal-error" id="login-error"></div>
    <div class="modal-actions">
      <button class="modal-btn" id="login-btn" type="button">Log In</button>
    </div>
    <div class="modal-link">
      Don't have an account? <a id="switch-to-signup">Sign Up</a>
    </div>
    <div class="modal-link" style="margin-top:4px;">
      <a id="close-modal-1">Close</a>
    </div>
  </div>
</div>

<!-- SIGNUP MODAL -->
<div class="modal-bg" id="signup-modal">
  <div class="modal">
    <div class="modal-h">Sign Up</div>
    <div class="modal-sub">Create your APEPE Community account.</div>
    <div class="modal-field">
      <label class="modal-label">Email</label>
      <input class="modal-input" type="email" id="signup-email" autocomplete="email">
    </div>
    <div class="modal-field">
      <label class="modal-label">Password (min 6 chars)</label>
      <input class="modal-input" type="password" id="signup-password" autocomplete="new-password">
    </div>
    <div class="modal-field">
      <label class="modal-label">Nickname (2-20 chars, unique)</label>
      <input class="modal-input" type="text" id="signup-nickname" maxlength="20">
    </div>
    <div class="modal-error" id="signup-error"></div>
    <div class="modal-actions">
      <button class="modal-btn" id="signup-btn" type="button">Sign Up</button>
    </div>
    <div class="modal-link">
      Already have an account? <a id="switch-to-login">Log In</a>
    </div>
    <div class="modal-link" style="margin-top:4px;">
      <a id="close-modal-2">Close</a>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.0'

const SUPABASE_URL = 'https://aejergnmqyiibgkqunxl.supabase.co'
const SUPABASE_KEY = 'sb_publishable_DXX6htNTRN9MV-NPATmhJQ_n6FYgjoL'

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

let currentUser = null
let currentProfile = null
let activePoll = null
let selectedOption = null
let myVote = null
let countdownInterval = null

// ─── Auth UI ───
function renderLoggedIn(profile){
  document.getElementById('auth-status').innerHTML = `
    <div class="auth-user">
      <span class="auth-dot"></span>
      <span class="auth-nick">@${escapeHtml(profile.nickname)}</span>
    </div>
    <button class="auth-btn-secondary" id="logout-btn" type="button">Log Out</button>`
  document.getElementById('logout-btn').addEventListener('click', doLogout)
  renderPoll()
}

function renderLoggedOut(){
  document.getElementById('auth-status').innerHTML = `
    <span class="auth-msg">Sign in to vote</span>
    <button class="auth-btn-secondary" id="open-login" type="button">Log In</button>
    <button class="auth-btn" id="open-signup" type="button">Sign Up</button>`
  document.getElementById('open-login').addEventListener('click', () => openModal('login'))
  document.getElementById('open-signup').addEventListener('click', () => openModal('signup'))
  renderPoll()
}

// Initial bindings
document.getElementById('open-login').addEventListener('click', () => openModal('login'))
document.getElementById('open-signup').addEventListener('click', () => openModal('signup'))
document.getElementById('switch-to-signup').addEventListener('click', () => openModal('signup'))
document.getElementById('switch-to-login').addEventListener('click', () => openModal('login'))
document.getElementById('close-modal-1').addEventListener('click', closeAllModals)
document.getElementById('close-modal-2').addEventListener('click', closeAllModals)
document.getElementById('login-btn').addEventListener('click', doLogin)
document.getElementById('signup-btn').addEventListener('click', doSignup)
document.getElementById('sub-btn').addEventListener('click', submitVote)

function openModal(which){
  closeAllModals()
  if(which === 'login') document.getElementById('login-modal').classList.add('show')
  else document.getElementById('signup-modal').classList.add('show')
}
function closeAllModals(){
  document.getElementById('login-modal').classList.remove('show')
  document.getElementById('signup-modal').classList.remove('show')
  document.getElementById('login-error').classList.remove('show')
  document.getElementById('signup-error').classList.remove('show')
}
function showLoginError(msg){
  const el = document.getElementById('login-error')
  el.textContent = msg
  el.classList.add('show')
}
function showSignupError(msg){
  const el = document.getElementById('signup-error')
  el.textContent = msg
  el.classList.add('show')
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim()
  const password = document.getElementById('login-password').value
  if(!email || !password){ showLoginError('Email and password required'); return }
  const btn = document.getElementById('login-btn')
  btn.disabled = true; btn.textContent = 'LOGGING IN...'
  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password })
    if(error) throw error
    await loadProfile(data.user)
    closeAllModals()
  } catch(e) {
    showLoginError(e.message || 'Login failed')
  } finally {
    btn.disabled = false; btn.textContent = 'Log In'
  }
}

async function doSignup(){
  const email = document.getElementById('signup-email').value.trim()
  const password = document.getElementById('signup-password').value
  const nickname = document.getElementById('signup-nickname').value.trim()
  if(!email || !password || !nickname){ showSignupError('All fields required'); return }
  if(password.length < 6){ showSignupError('Password must be at least 6 characters'); return }
  if(nickname.length < 2 || nickname.length > 20){ showSignupError('Nickname must be 2-20 characters'); return }

  const btn = document.getElementById('signup-btn')
  btn.disabled = true; btn.textContent = 'CREATING...'
  try {
    const { data: existing, error: chkErr } = await supabase
      .from('user_profiles')
      .select('nickname')
      .ilike('nickname', nickname)
      .limit(1)
    if(chkErr) throw chkErr
    if(existing && existing.length > 0){
      showSignupError('Nickname already taken. Please choose another.')
      btn.disabled = false; btn.textContent = 'Sign Up'; return
    }

    const { data: signupData, error: signupErr } = await supabase.auth.signUp({ email, password })
    if(signupErr) throw signupErr
    const user = signupData.user
    if(!user) throw new Error('Sign up failed: no user returned')

    const { error: profErr } = await supabase
      .from('user_profiles')
      .insert({ id: user.id, nickname })
    if(profErr){
      if((profErr.message || '').toLowerCase().includes('duplicate')){
        showSignupError('Nickname already taken. Please choose another.')
      } else {
        showSignupError('Profile creation failed: ' + profErr.message)
      }
      btn.disabled = false; btn.textContent = 'Sign Up'; return
    }

    await loadProfile(user)
    closeAllModals()
  } catch(e) {
    showSignupError(e.message || 'Sign up failed')
  } finally {
    btn.disabled = false; btn.textContent = 'Sign Up'
  }
}

async function doLogout(){
  await supabase.auth.signOut()
  currentUser = null
  currentProfile = null
  myVote = null
  renderLoggedOut()
}

async function loadProfile(user){
  currentUser = user
  const { data, error } = await supabase
    .from('user_profiles')
    .select('nickname')
    .eq('id', user.id)
    .single()
  if(error || !data){
    currentProfile = null
    renderLoggedOut()
    return
  }
  currentProfile = data
  renderLoggedIn(data)
}

// ─── Poll load ───
async function loadPoll(){
  const { data: polls, error } = await supabase
    .from('polls')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(1)
  if(error || !polls || polls.length === 0){
    document.getElementById('loading').textContent = 'No poll available'
    return
  }
  activePoll = polls[0]
  if(currentUser){
    const { data: votes } = await supabase
      .from('poll_votes')
      .select('option_index')
      .eq('poll_id', activePoll.id)
      .eq('user_id', currentUser.id)
      .limit(1)
    myVote = votes && votes.length > 0 ? votes[0].option_index : null
  } else {
    myVote = null
  }
  renderPoll()
}

function renderPoll(){
  if(!activePoll){
    document.getElementById('loading').textContent = 'No poll available'
    document.getElementById('poll-content').style.display = 'none'
    document.getElementById('sub-bar').style.display = 'none'
    return
  }
  document.getElementById('loading').style.display = 'none'
  const wrap = document.getElementById('poll-content')
  wrap.style.display = 'block'

  const now = Date.now()
  const opensAt = activePoll.opens_at ? new Date(activePoll.opens_at).getTime() : 0
  const closesAt = new Date(activePoll.closes_at).getTime()
  const isOpen = activePoll.is_active && opensAt <= now && now < closesAt
  const isUpcoming = activePoll.is_active && opensAt > now
  const isClosed = !activePoll.is_active || now >= closesAt

  let html = `
    <div class="r-head">
      <span class="r-tag">${escapeHtml(activePoll.title || 'Vote')}</span>
      <h1 class="r-title">${escapeHtml(activePoll.title || 'Poll')}</h1>
      <p class="r-q">${escapeHtml(activePoll.question || '')}</p>
    </div>
    <div class="r-divider"></div>
  `

  if(isUpcoming){
    html += renderUpcoming(opensAt)
  } else if(isClosed){
    html += renderClosed()
  } else if(myVote !== null){
    html += renderVoted()
  } else if(!currentUser){
    html += renderNeedsLogin()
  } else {
    html += renderActive()
  }
  wrap.innerHTML = html

  if(isUpcoming){
    startCountdown(opensAt)
    document.getElementById('sub-bar').style.display = 'none'
  } else if(isOpen && currentUser && myVote === null){
    document.getElementById('sub-bar').style.display = 'block'
    document.getElementById('sub-btn').disabled = true
    bindOptions()
  } else {
    document.getElementById('sub-bar').style.display = 'none'
  }
}

function renderClosed(){
  // Render closed with current results
  return `
    <div class="state-notice closed">
      <span class="state-icon">🔒</span>
      <span>This poll is closed. Final results below.</span>
    </div>
    ${renderResults(true)}
  `
}

function renderVoted(){
  return `
    <div class="state-notice voted">
      <span class="state-icon">✓</span>
      <span>You have voted. Your choice: <strong>${escapeHtml(activePoll.options[myVote])}</strong></span>
    </div>
    ${renderResults(true)}
  `
}

function renderNeedsLogin(){
  return `
    <div class="state-notice">
      <span class="state-icon">🔑</span>
      <span>Please sign in to cast your vote.</span>
    </div>
    ${renderResults(true)}
  `
}

function renderActive(){
  return `
    <div class="opts-box" id="opts-box">
      ${activePoll.options.map((opt, i) => `
        <button class="opt" data-idx="${i}" type="button">
          <span class="opt-radio"></span>
          <span class="opt-label">${escapeHtml(opt)}</span>
          <span class="opt-num">${i + 1}</span>
        </button>
      `).join('')}
    </div>
  `
}

function bindOptions(){
  document.querySelectorAll('.opt[data-idx]').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx)
      selectedOption = idx
      document.querySelectorAll('.opt').forEach((e, i) => e.classList.toggle('selected', i === idx))
      document.getElementById('sub-btn').disabled = false
    })
  })
}

function renderUpcoming(opensAt){
  const opensDate = new Date(opensAt)
  const opensStr = opensDate.toLocaleString()
  return `
    <div class="countdown-box">
      <div class="cd-label">Voting Opens In</div>
      <div class="cd-time-row" id="cd-row">
        <div class="cd-unit"><div class="cd-val" id="cd-d">00</div><div class="cd-u">Days</div></div>
        <div class="cd-sep">:</div>
        <div class="cd-unit"><div class="cd-val" id="cd-h">00</div><div class="cd-u">Hours</div></div>
        <div class="cd-sep">:</div>
        <div class="cd-unit"><div class="cd-val" id="cd-m">00</div><div class="cd-u">Minutes</div></div>
        <div class="cd-sep">:</div>
        <div class="cd-unit"><div class="cd-val" id="cd-s">00</div><div class="cd-u">Seconds</div></div>
      </div>
      <div class="cd-when">Opens at ${escapeHtml(opensStr)}</div>
    </div>
    <div class="opts-box">
      ${activePoll.options.map((opt, i) => `
        <button class="opt" disabled>
          <span class="opt-radio"></span>
          <span class="opt-label">${escapeHtml(opt)}</span>
          <span class="opt-num">${i + 1}</span>
        </button>
      `).join('')}
    </div>
  `
}

function startCountdown(opensAt){
  if(countdownInterval) clearInterval(countdownInterval)
  const tick = () => {
    const diff = opensAt - Date.now()
    if(diff <= 0){
      clearInterval(countdownInterval)
      loadPoll()
      return
    }
    const d = Math.floor(diff / 86400000)
    const h = Math.floor((diff % 86400000) / 3600000)
    const m = Math.floor((diff % 3600000) / 60000)
    const s = Math.floor((diff % 60000) / 1000)
    const dEl = document.getElementById('cd-d')
    if(!dEl) return
    dEl.textContent = String(d).padStart(2, '0')
    document.getElementById('cd-h').textContent = String(h).padStart(2, '0')
    document.getElementById('cd-m').textContent = String(m).padStart(2, '0')
    document.getElementById('cd-s').textContent = String(s).padStart(2, '0')
  }
  tick()
  countdownInterval = setInterval(tick, 1000)
}

// ─── Results render ───
function renderResults(showAll){
  return `<div class="result-box" id="results-box">
    <div class="result-h">
      <span class="result-h-label">Live Results</span>
      <span class="result-h-total">
        <span class="result-h-num" id="result-total">—</span>
        <span class="result-h-lbl">votes total</span>
      </span>
    </div>
    <div id="result-bars">Loading...</div>
  </div>`
}

async function loadResults(){
  if(!activePoll) return
  // Pagination - Supabase server-side max-rows cap (1000)
  let votes = []
  let offset = 0
  const pageSize = 1000
  while(true){
    const { data: page, error } = await supabase
      .from('poll_votes')
      .select('option_index')
      .eq('poll_id', activePoll.id)
      .range(offset, offset + pageSize - 1)
    if(error){ console.error(error); return }
    if(!page || page.length === 0) break
    votes = votes.concat(page)
    if(page.length < pageSize) break
    offset += pageSize
    if(offset > 1000000) break
  }
  const counts = new Array(activePoll.options.length).fill(0)
  votes.forEach(v => { if(v.option_index >= 0 && v.option_index < counts.length) counts[v.option_index]++ })
  const total = counts.reduce((a, b) => a + b, 0)

  // Find leading option (max count). Order stays as defined in poll.
  const maxCount = Math.max(...counts)
  const bars = activePoll.options.map((opt, i) => {
    const pct = total > 0 ? (counts[i] / total * 100) : 0
    const isMy = myVote === i
    const isLeading = total > 0 && counts[i] === maxCount
    const fillCls = pct < 15 ? ' low' : ''
    return `
      <div class="r-card${isLeading ? ' leading' : ''}">
        ${isLeading ? '<div class="r-card-badge">★ Leading</div>' : ''}
        <div class="r-card-row">
          <div class="r-card-info">
            <span class="r-card-num">${i + 1}.</span>
            <span class="r-card-name">${escapeHtml(opt)}</span>
            ${isMy ? '<span class="r-card-you">(YOU)</span>' : ''}
          </div>
          <div class="r-card-stats">
            <div class="r-card-pct">${pct.toFixed(1)}%</div>
            <div class="r-card-votes">${counts[i]} vote${counts[i] === 1 ? '' : 's'}</div>
          </div>
        </div>
        <div class="r-card-bar"><div class="r-card-fill${fillCls}" style="width:${pct}%"></div></div>
      </div>
    `
  }).join('')

  const totalEl = document.getElementById('result-total')
  const barsEl = document.getElementById('result-bars')
  if(totalEl) totalEl.textContent = total
  if(barsEl) barsEl.innerHTML = bars
}

// ─── Submit vote ───
async function submitVote(){
  if(!currentUser){ alert('Please sign in first.'); return }
  if(selectedOption === null){ alert('Please select an option.'); return }
  if(!activePoll){ return }

  const btn = document.getElementById('sub-btn')
  const btnTxt = document.getElementById('btn-txt')
  btn.disabled = true
  btnTxt.textContent = 'SUBMITTING...'

  try {
    const { error } = await supabase
      .from('poll_votes')
      .upsert({
        poll_id: activePoll.id,
        option_index: selectedOption,
        user_id: currentUser.id,
        session_id: 'user:' + currentUser.id,
        nickname: currentProfile.nickname,
        source: 'direct'
      }, { onConflict: 'poll_id,session_id' })
    if(error) throw error
    myVote = selectedOption
    selectedOption = null
    await loadPoll()
    await loadResults()
  } catch(e) {
    btn.disabled = false
    btnTxt.textContent = 'SUBMIT YOUR VOTE'
    alert('Vote failed: ' + (e.message || e))
  }
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}

supabase.auth.onAuthStateChange(async (event, session) => {
  if(event === 'SIGNED_OUT'){
    currentUser = null
    currentProfile = null
    myVote = null
    renderLoggedOut()
  }
})

async function init(){
  const { data: { session } } = await supabase.auth.getSession()
  if(session && session.user){
    await loadProfile(session.user)
  }
  await loadPoll()
  await loadResults()
  // Auto-refresh results every 5 seconds
  setInterval(() => {
    if(activePoll){
      loadResults().catch(e => console.warn('Auto-refresh failed:', e))
    }
  }, 5000)
}

init()
</script>
