<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base href="/communityflow/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEPE · Community Input — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0a0a0a;color:#fff;font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
body{padding:24px;display:flex;justify-content:center;align-items:center;min-height:100vh;}
.card{width:100%;max-width:1280px;display:grid;grid-template-columns:1fr 1fr;gap:0;background:#111;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.06);box-shadow:0 30px 80px rgba(0,0,0,.55);position:relative;}

.img-panel{background:#0a1402;position:relative;display:flex;align-items:center;justify-content:center;min-height:520px;overflow:hidden;}
.hero-img{width:100%;height:100%;object-fit:contain;display:block;background:#0a1402;}
.img-fallback{display:none;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.4);text-align:center;}
.fb-txt{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-top:8px;}

.right-panel{display:flex;flex-direction:column;background:#0e0e0e;position:relative;}
.r-edge{position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(232,170,90,.25),transparent);}

.top-bar{position:relative;z-index:3;padding:14px 28px;border-bottom:1px solid rgba(255,255,255,.06);background:#0e0e0e;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.back-btn{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.7);font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.7px;padding:7px 14px;border-radius:5px;cursor:pointer;text-transform:uppercase;text-decoration:none;}
.back-btn:hover{color:#fff;border-color:rgba(255,255,255,.3);}
.top-label{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;font-weight:700;color:rgba(232,170,90,.85);letter-spacing:2px;text-transform:uppercase;}

.r-body{padding:60px 40px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}

.cs-tag{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#e8aa5a;border:1px solid rgba(232,170,90,.4);padding:5px 14px;border-radius:4px;margin-bottom:22px;}

.cs-title{font-family:'Barlow Condensed',sans-serif;font-size:54px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1;margin-bottom:14px;text-transform:uppercase;background:linear-gradient(180deg,#fff 0%,#999 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

.cs-sub{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:28px;}

.cs-desc{font-size:14.5px;color:rgba(255,255,255,.55);line-height:1.65;max-width:380px;margin-bottom:34px;}

.cs-cta{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:300px;}
.vote-btn{width:100%;background:linear-gradient(180deg,#cbed3a 0%,#b4e840 100%);color:#0a1402;border:none;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;letter-spacing:.8px;padding:14px 22px;border-radius:9px;cursor:pointer;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 1px 0 rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3);transition:all .15s;text-decoration:none;}
.vote-btn:hover{filter:brightness(1.05);transform:translateY(-1px);}
.vote-btn-icon{font-size:18px;}

.cs-dots{display:flex;gap:8px;margin-top:18px;justify-content:center;}
.cs-dot{width:7px;height:7px;border-radius:50%;background:rgba(232,170,90,.4);animation:cs-pulse 1.4s ease-in-out infinite;}
.cs-dot:nth-child(2){animation-delay:.18s;}
.cs-dot:nth-child(3){animation-delay:.36s;}
@keyframes cs-pulse{
  0%,80%,100%{transform:scale(.6);opacity:.4;}
  40%{transform:scale(1);opacity:1;}
}

@media(max-width:980px){
  body{padding:14px;}
  .card{grid-template-columns:1fr;}
  .img-panel{min-height:280px;}
  .r-body{padding:36px 22px;}
  .cs-title{font-size:42px;}
  .cs-sub{font-size:15px;}
}
</style>
</head>
<body>
<div class="card">

  <div class="img-panel">
    <img class="hero-img" src="form-image.jpg" alt=""
      onerror="this.style.display='none';document.querySelector('.img-fallback').style.display='flex';">
    <div class="img-fallback">
      <div style="font-size:36px;opacity:.15;">⏳</div>
      <div class="fb-txt">Coming Soon</div>
    </div>
  </div>

  <div class="right-panel">
    <div class="r-edge"></div>

    <div class="top-bar">
      <a class="back-btn" href="/communityflow">← Back</a>
      <span class="top-label">APEPE Community FLOW</span>
    </div>

    <div class="r-body">
      <span class="cs-tag">Opinion Submission</span>
      <h1 class="cs-title">Coming Soon</h1>
      <div class="cs-sub">Stay Tuned</div>
      <p class="cs-desc">
        We're running a community vote right now.<br>
        Opinion submission will be available again after the current voting round wraps up.
      </p>

      <div class="cs-cta">
        <a class="vote-btn" href="vote.html">
          <span class="vote-btn-icon">▶</span>
          <span>Go to Community Vote</span>
        </a>
      </div>

      <div class="cs-dots">
        <span class="cs-dot"></span>
        <span class="cs-dot"></span>
        <span class="cs-dot"></span>
      </div>
    </div>

  </div>
</div>
</body>
</html>
